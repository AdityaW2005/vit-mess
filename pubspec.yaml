name: vit_mess
description: "MessUp — the VIT-AP hostel mess menu, answered in under two seconds."
# Never published to pub.dev; this is an application, not a package.
publish_to: 'none'

# versionName+versionCode for Android, CFBundleShortVersionString+CFBundleVersion
# for iOS. Bump the build number on every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  get_it: ^9.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  timezone: ^0.11.1
  file_picker: ^12.0.0
  excel: ^4.0.6
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint set applied by analysis_options.yaml.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons are generated from one source image:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  # true overwrites ic_launcher, so AndroidManifest needs no change.
  android: true
  ios: true
  # Android 8+ masks the foreground to the middle ~66% of the canvas. The
  # artwork is full-bleed, so it is inset to sit inside every mask shape.
  adaptive_icon_background: "#1F1813"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 20
  # App Store rejects an icon with an alpha channel.
  remove_alpha_ios: true
  background_color_ios: "#1F1813"